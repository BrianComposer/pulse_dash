[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-dash"
version = "1.0.0"
description = "A polished Geometry Dash-inspired rhythm platformer built with Python and Pygame."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Santi Perez"}]
keywords = ["pygame", "game", "platformer", "geometry-dash", "rhythm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Arcade",
]
dependencies = ["pygame>=2.5.0"]

[project.urls]
Repository = "https://github.com/your-user/pulse-dash"

[project.scripts]
pulse-dash = "pulse_dash.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pulse_dash = ["assets/**/*", "levels/*.json"]
